<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>360° Photo Space</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#000; --glass:rgba(255,255,255,.08); --glass-brd:rgba(255,255,255,.14);
    --text:#f4f5f7; --muted:#a9aab4; --accent:#5b8dff;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--bg); overflow:hidden; touch-action:manipulation; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text); -webkit-tap-highlight-color:transparent; }
  #stage{ position:fixed; inset:0; z-index:1; }
  #stage.pointer{ cursor:pointer; }
  canvas{ display:block; touch-action:none; }

  #hint{
    position:absolute; z-index:10; top:calc(16px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%);
    background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-brd); padding:9px 16px; border-radius:100px; font-size:13px; color:var(--muted);
    pointer-events:none; transition:opacity .5s ease; white-space:nowrap; text-align:center; max-width:90vw;
  }

  #bar{
    position:absolute; z-index:10; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
    display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; max-width:94vw;
    background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--glass-brd); border-radius:100px; padding:8px; box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  button, label.btn{
    background:transparent; color:var(--text); border:none; border-radius:100px;
    min-height:44px; padding:0 16px; font-size:13.5px; font-weight:500; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
    transition:background .2s ease, transform .15s ease;
  }
  button:hover, label.btn:hover{ background:rgba(255,255,255,.1); }
  button:active, label.btn:active{ transform:scale(.94); }
  button.active{ background:var(--accent); }
  button.active:hover{ background:var(--accent); }
  input[type=file]{ display:none; }

  #zoomRow{ display:flex; align-items:center; gap:8px; padding:0 8px 0 4px; }
  input[type=range]{ width:100px; accent-color:var(--accent); }
  .icon{ font-size:16px; line-height:1; }
  .label{ }

  .viewer-only{ display:none; }
  body.mode-viewer .viewer-only{ display:inline-flex; }
  body.mode-viewer .gallery-only{ display:none; }

  /* Mobile: tighter bar, icons only for secondary actions */
  @media (max-width: 560px){
    #bar{ gap:2px; padding:6px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); }
    button, label.btn{ padding:0 12px; font-size:0; min-width:44px; justify-content:center; }
    .icon{ font-size:18px; }
    #backBtn .label{ font-size:13px; margin-left:2px; } /* keep "Back" readable */
    #zoomRow{ padding:0 4px; }
    input[type=range]{ width:72px; }
    #hint{ font-size:12px; padding:7px 12px; top:calc(10px + env(safe-area-inset-top,0px)); }
    #caption{ font-size:12px; padding:7px 12px; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hint">Loading your space…</div>
<div id="caption" class="viewer-only" style="position:absolute;z-index:10;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-brd);padding:8px 16px;border-radius:100px;font-size:13px;color:var(--text);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;"></div>

<div id="bar">
  <button id="backBtn" class="viewer-only"><span class="icon">←</span><span class="label">Back</span></button>
  <button id="modeToggle" class="viewer-only"><span class="icon">🪐</span><span class="label">Tiny Planet</span></button>
  <button id="autoRotate" class="viewer-only"><span class="icon">▶</span><span class="label">Rotate</span></button>
  <div id="zoomRow" class="viewer-only">
    <span class="icon">🔍</span>
    <input id="zoomSlider" type="range" min="35" max="100" value="75">
  </div>
  <button id="fullscreen"><span class="icon">⛶</span><span class="label">Fullscreen</span></button>
</div>

<script>
(function(){
  // ============================================================
  // ⬇️ YOUR PHOTOS — upload these files into the same folder as this page ⬇️
  // ============================================================
  const PHOTOS = [
    { src: "01.jpg", caption: "Morning over the ridge"     },
    { src: "02.jpg", caption: "City lights at dusk"        },
    { src: "03.jpg", caption: "Waves at low tide"          },
    { src: "04.jpg", caption: "Deep in the pine forest"    },
    { src: "05.jpg", caption: "Dunes past sunset"          },
    { src: "06.jpg", caption: "Snow on the summit"         },
    { src: "07.jpg", caption: "A quiet lake"               },
    { src: "08.jpg", caption: "Foggy morning"              },
    { src: "09.jpg", caption: "Desert canyon"              }
    // { src: "10.jpg", caption: "Starry night"               }
  ].map((p, i) => ({ ...p, hue: Math.round((360 / 6) * i) }));

  const body = document.body;
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(window.innerWidth, window.innerHeight);
  stage.appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 4000);
  let lon = 0, lat = 0, planetMode = false, autoRotating = false;
  let appState = 'gallery';

  function makeDemoTexture(label, hue){
    const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
    const ctx = c.getContext('2d');
    const sky = ctx.createLinearGradient(0,0,0,c.height*0.55);
    sky.addColorStop(0, `hsl(${hue},60%,25%)`); sky.addColorStop(1, `hsl(${hue},55%,55%)`);
    ctx.fillStyle = sky; ctx.fillRect(0,0,c.width,c.height*0.55);
    const ground = ctx.createLinearGradient(0,c.height*0.55,0,c.height);
    ground.addColorStop(0, `hsl(${hue+30},30%,35%)`); ground.addColorStop(1, `hsl(${hue+30},30%,12%)`);
    ctx.fillStyle = ground; ctx.fillRect(0,c.height*0.55,c.width,c.height*0.45);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(label, c.width/2, c.height*0.52);
    return new THREE.CanvasTexture(c);
  }
  // Loads a real photo if present; falls back to a placeholder planet if not found.
  function ensureTexture(photo, cb){
    if(photo.texture){ cb(photo.texture); return; }
    new THREE.TextureLoader().load(photo.src, tex => { photo.texture = tex; cb(tex); },
      undefined, () => { photo.texture = makeDemoTexture(photo.caption, photo.hue); cb(photo.texture); });
  }

  // ---------- Gallery: starfield + floating photo "planets" ----------
  const galaxyScene = new THREE.Scene();
  {
    const n = 1200, positions = new Float32Array(n*3);
    for(let i=0;i<n;i++){
      const r = 800 + Math.random()*2200, th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
      positions[i*3]=r*Math.sin(ph)*Math.cos(th); positions[i*3+1]=r*Math.cos(ph); positions[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(positions,3));
    galaxyScene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:2.2, sizeAttenuation:true, transparent:true, opacity:.85 })));
  }
  const orbs = [];
  PHOTOS.forEach((photo, i) => {
    const group = new THREE.Group();
    const visible = new THREE.Mesh(new THREE.SphereGeometry(26,28,20), new THREE.MeshBasicMaterial({ color:0x888888 }));
    const hit = new THREE.Mesh(new THREE.SphereGeometry(42,12,10), new THREE.MeshBasicMaterial({ transparent:true, opacity:0, depthWrite:false }));
    group.add(visible); group.add(hit);
    galaxyScene.add(group);
    const orbit = { group, hit, photo, radius:220+Math.random()*260, speed:0.05+Math.random()*0.08,
      incl:(Math.random()-0.5)*1.4, phase:(i/PHOTOS.length)*Math.PI*2, spin:0.1+Math.random()*0.2 };
    hit.userData.orbit = orbit;
    orbs.push(orbit);
    ensureTexture(photo, tex => { visible.material.map = tex; visible.material.color.set(0xffffff); visible.material.needsUpdate = true; });
  });

  // ---------- Normal sphere viewer ----------
  const sceneNormal = new THREE.Scene();
  const sphereGeo = new THREE.SphereGeometry(500,60,40); sphereGeo.scale(-1,1,1);
  const material = new THREE.MeshBasicMaterial();
  sceneNormal.add(new THREE.Mesh(sphereGeo, material));

  // ---------- Tiny planet (stereographic) viewer ----------
  const scenePlanet = new THREE.Scene();
  const orthoCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const planetUniforms = { map:{value:null}, resolution:{value:new THREE.Vector2(window.innerWidth,window.innerHeight)}, lon:{value:0}, lat:{value:0}, fov:{value:75} };
  const planetMaterial = new THREE.ShaderMaterial({
    uniforms: planetUniforms,
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
    fragmentShader:`
      precision highp float;
      uniform sampler2D map; uniform vec2 resolution; uniform float lon, lat, fov;
      const float PI = 3.14159265359;
      vec2 equirectUv(vec3 dir){
        float u = atan(dir.z, -dir.x) / (2.0*PI) + 0.5; // sign matches the inside-view sphere convention (not mirrored)
        float v = asin(clamp(dir.y,-1.0,1.0)) / PI + 0.5;
        return vec2(u, v);
      }
      void main(){
        vec2 uv = (gl_FragCoord.xy/resolution.xy)*2.0-1.0;
        uv.x *= resolution.x/resolution.y;
        float scale = tan(radians(fov)*0.5) * 2.0;
        float r = length(uv) * scale;
        float theta = atan(uv.y, uv.x);
        float c = 2.0 * atan(r);
        float phi = radians(90.0 - lat);
        float lam = radians(lon);
        vec3 forward = normalize(vec3(sin(phi)*cos(lam), cos(phi), sin(phi)*sin(lam)));
        vec3 worldUp = abs(forward.y) > 0.999 ? vec3(0.0,0.0,1.0) : vec3(0.0,1.0,0.0);
        vec3 right = normalize(cross(worldUp, forward));
        vec3 up = cross(forward, right);
        vec3 dir = forward*cos(c) + (right*cos(theta) + up*sin(theta)) * sin(c);
        gl_FragColor = texture2D(map, equirectUv(normalize(dir)));
      }`
  });
  scenePlanet.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), planetMaterial));

  function setViewerTexture(tex){
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.ClampToEdgeWrapping; tex.needsUpdate = true;
    material.map = tex; material.needsUpdate = true;
    const planetTex = tex.clone();
    planetTex.image = tex.image; planetTex.generateMipmaps = false;
    planetTex.minFilter = THREE.LinearFilter; planetTex.magFilter = THREE.LinearFilter;
    planetTex.wrapS = THREE.RepeatWrapping; planetTex.wrapT = THREE.ClampToEdgeWrapping; planetTex.needsUpdate = true;
    planetUniforms.map.value = planetTex;
  }

  // ---------- UI ----------
  const hint = document.getElementById('hint');
  function setHint(text, autoHide){
    hint.textContent = text; hint.style.opacity = '1'; clearTimeout(hint._t);
    if(autoHide) hint._t = setTimeout(() => hint.style.opacity = '0', 3200);
  }
  function openViewer(photo){
    ensureTexture(photo, tex => {
      setViewerTexture(tex);
      appState = 'viewer'; body.classList.add('mode-viewer');
      lon = 0; lat = 0; planetMode = false; setFov(75);
      const mt = document.getElementById('modeToggle');
      mt.querySelector('.label').textContent = 'Tiny Planet'; mt.querySelector('.icon').textContent='🪐'; mt.classList.remove('active');
      document.getElementById('caption').textContent = photo.caption || '';
      setHint('Drag to look around · Scroll or pinch to zoom', true);
    });
  }
  function backToSpace(){ appState='gallery'; body.classList.remove('mode-viewer'); setHint('Tap a floating photo to explore it in 360°', true); }
  document.getElementById('backBtn').addEventListener('click', backToSpace);
  setHint('Tap a floating photo to explore it in 360°', true);

  // ---------- Controls ----------
  let isDown=false, downX=0, downY=0, startLon=0, startLat=0, moved=false;
  const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
  function onDown(x,y){ isDown=true; downX=x; downY=y; startLon=lon; startLat=lat; moved=false; }
  function onMove(x,y){
    if(!isDown) return;
    if(Math.hypot(x-downX,y-downY) > 6) moved = true;
    lon = startLon + (downX-x) * (planetMode?0.2:0.15);
    lat = Math.max(-90, Math.min(90, startLat + (y-downY) * (planetMode?0.2:0.15)));
  }
  function pickOrb(x,y){
    mouse.x=(x/window.innerWidth)*2-1; mouse.y=-(y/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(orbs.map(o=>o.hit));
    return hits.length ? hits[0].object.userData.orbit.photo : null;
  }
  function onUp(x,y){
    isDown = false;
    if(appState==='gallery' && !moved){ const p = pickOrb(x,y); if(p) openViewer(p); }
  }
  renderer.domElement.addEventListener('mousedown', e => onDown(e.clientX,e.clientY));
  window.addEventListener('mousemove', e => {
    onMove(e.clientX,e.clientY);
    if(appState==='gallery' && !isDown) stage.classList.toggle('pointer', !!pickOrb(e.clientX,e.clientY));
  });
  window.addEventListener('mouseup', e => onUp(e.clientX,e.clientY));
  renderer.domElement.addEventListener('touchstart', e => { const t=e.touches[0]; onDown(t.clientX,t.clientY); }, {passive:true});
  renderer.domElement.addEventListener('touchmove', e => { const t=e.touches[0]; onMove(t.clientX,t.clientY); }, {passive:true});
  renderer.domElement.addEventListener('touchend', e => { const t=e.changedTouches[0]; onUp(t.clientX,t.clientY); });

  function setFov(v){
    camera.fov = Math.max(35, Math.min(100, v)); camera.updateProjectionMatrix();
    planetUniforms.fov.value = camera.fov; document.getElementById('zoomSlider').value = Math.round(camera.fov);
  }
  renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); setFov(camera.fov + e.deltaY*0.03); }, {passive:false});
  let pinchDist=null;
  renderer.domElement.addEventListener('touchstart', e => {
    if(e.touches.length===2) pinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  }, {passive:true});
  renderer.domElement.addEventListener('touchmove', e => {
    if(e.touches.length===2 && pinchDist){
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      setFov(camera.fov + (pinchDist-d)*0.15); pinchDist = d;
    }
  }, {passive:true});
  document.getElementById('zoomSlider').addEventListener('input', e => setFov(Number(e.target.value)));

  document.getElementById('autoRotate').addEventListener('click', e => {
    autoRotating = !autoRotating;
    e.currentTarget.querySelector('.icon').textContent = autoRotating ? '⏸' : '▶';
    e.currentTarget.querySelector('.label').textContent = autoRotating ? 'Stop' : 'Rotate';
    e.currentTarget.classList.toggle('active', autoRotating);
  });
  document.getElementById('fullscreen').addEventListener('click', () => {
    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });
  const modeBtn = document.getElementById('modeToggle');
  modeBtn.addEventListener('click', () => {
    planetMode = !planetMode;
    modeBtn.querySelector('.icon').textContent = planetMode ? '↔' : '🪐';
    modeBtn.querySelector('.label').textContent = planetMode ? 'Normal View' : 'Tiny Planet';
    modeBtn.classList.toggle('active', planetMode);
    if(planetMode && lat>-20 && lat<20){ lat=-80; setFov(100); }
    setHint(planetMode ? 'Drag sideways to spin · Drag up/down to flip tiny planet ↔ rabbit hole'
                        : 'Drag to look around · Scroll or pinch to zoom', true);
  });
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    if(autoRotating && appState==='viewer') lon += 0.05;
    if(appState==='gallery' && !isDown) lon += 0.02;
    planetUniforms.lon.value = lon; planetUniforms.lat.value = lat;

    const phi = THREE.MathUtils.degToRad(90-lat), theta = THREE.MathUtils.degToRad(lon);
    const dist = appState==='gallery' ? 1 : 500;
    camera.position.set(0,0,0);
    camera.lookAt(dist*Math.sin(phi)*Math.cos(theta), dist*Math.cos(phi), dist*Math.sin(phi)*Math.sin(theta));

    if(appState==='gallery'){
      orbs.forEach(o => {
        const a = o.phase + t*o.speed;
        o.group.position.set(o.radius*Math.cos(a), o.radius*Math.sin(a)*Math.sin(o.incl), o.radius*Math.sin(a)*Math.cos(o.incl));
        o.group.children[0].rotation.y += o.spin*0.01;
      });
      renderer.render(galaxyScene, camera);
    } else if(planetMode){
      renderer.render(scenePlanet, orthoCam);
    } else {
      renderer.render(sceneNormal, camera);
    }
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    planetUniforms.resolution.value.set(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
