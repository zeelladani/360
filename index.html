<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>360° Photo Space</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#000; --glass:rgba(18,18,24,.62); --glass-brd:rgba(255,255,255,.14);
    --text:#f4f5f7; --muted:#a9aab4; --accent:#5b8dff;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--bg); overflow:hidden; overscroll-behavior:none; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text); -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  #stage{ position:fixed; inset:0; z-index:1; touch-action:none; }
  #stage.pointer{ cursor:pointer; }
  #stage.grab{ cursor:grab; } #stage.grabbing{ cursor:grabbing; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  #hint{
    position:fixed; z-index:10; top:calc(12px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%);
    background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-brd); padding:8px 16px; border-radius:100px; font-size:13px; color:var(--muted);
    pointer-events:none; transition:opacity .5s ease; text-align:center; max-width:92vw;
  }

  /* ---------- Footer dock ---------- */
  #footer{
    position:fixed; z-index:10; left:0; right:0; bottom:0;
    background:var(--glass); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    border-top:1px solid var(--glass-brd);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  #caption{ font-size:13px; color:var(--text); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #controls{ display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; width:100%; max-width:760px; }
  button{
    background:transparent; color:var(--text); border:none; border-radius:14px; font:inherit;
    min-height:48px; min-width:48px; padding:6px 14px; font-size:13px; font-weight:500; cursor:pointer;
    display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; white-space:nowrap;
    transition:background .2s ease, transform .15s ease;
  }
  button:hover{ background:rgba(255,255,255,.1); }
  button:active{ transform:scale(.94); }
  button.active, button.active:hover{ background:var(--accent); }
  button:focus-visible, a:focus-visible, input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .icon{ font-size:19px; line-height:1; }
  .label{ font-size:11.5px; line-height:1; }
  #zoomRow{ display:flex; align-items:center; gap:10px; padding:0 8px; min-width:180px; }
  #zoomRow .icon{ font-size:17px; }
  input[type=range]{ flex:1; width:140px; height:32px; accent-color:var(--accent); touch-action:pan-x; }

  #credits{ display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
  #credits a{ color:var(--text); text-decoration:none; padding:6px 4px; border-bottom:1px solid transparent; }
  #credits a:hover{ border-bottom-color:var(--accent); }

  .viewer-only{ display:none !important; }
  body.mode-viewer #controls .viewer-only{ display:inline-flex !important; }
  body.mode-viewer #zoomRow.viewer-only{ display:flex !important; }
  body.mode-viewer #caption.viewer-only{ display:block !important; }

  @media (max-width:640px){
    #controls{ gap:2px; }
    #controls button{ flex:1 1 0; min-width:0; padding:6px 4px; }
    #zoomRow{ order:-1; flex:1 0 100%; padding:0 6px; }
    #zoomRow input{ width:auto; }
    #hint{ font-size:12px; padding:7px 12px; }
    #credits{ font-size:11.5px; gap:10px; }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hint">Loading your space…</div>

<footer id="footer">
  <div id="caption" class="viewer-only"></div>
  <div id="controls">
    <button id="backBtn" class="viewer-only" aria-label="Back to gallery"><span class="icon">←</span><span class="label">Back</span></button>
    <button id="modeToggle" class="viewer-only" aria-label="Toggle tiny planet"><span class="icon">🪐</span><span class="label">Tiny Planet</span></button>
    <button id="autoRotate" class="viewer-only" aria-label="Toggle auto rotate"><span class="icon">▶</span><span class="label">Rotate</span></button>
    <div id="zoomRow" class="viewer-only">
      <span class="icon">🔍</span>
      <input id="zoomSlider" type="range" min="35" max="100" value="75" aria-label="Zoom">
    </div>
    <button id="fullscreen" aria-label="Fullscreen"><span class="icon">⛶</span><span class="label">Fullscreen</span></button>
  </div>
  <div id="credits">
    <span>Created by Zeel Ladani</span>
    <a href="https://www.instagram.com/zeel_ladani129/?hl=en" target="_blank" rel="noopener noreferrer">Instagram</a>
    <a href="https://www.zeelladani.in" target="_blank" rel="noopener noreferrer">zeelladani.in</a>
  </div>
</footer>

<script>
(function(){
  // ============================================================
  // ⬇️ YOUR PHOTOS — upload these files into the same folder as this page ⬇️
  // ============================================================
  const PHOTOS = [
    { src: "01.jpg", caption: "Morning over the ridge"     },
    { src: "02.jpg", caption: "City lights at dusk"        },
    { src: "03.jpg", caption: "Waves at low tide"          },
    { src: "04.jpg", caption: "Deep in the pine forest"    },
    { src: "05.jpg", caption: "Dunes past sunset"          },
    { src: "06.jpg", caption: "Snow on the summit"         },
    { src: "07.jpg", caption: "A quiet lake"               },
    { src: "08.jpg", caption: "Foggy morning"              },
    { src: "09.jpg", caption: "Desert canyon"              }
    // { src: "10.jpg", caption: "Starry night"               }
  ].map((p, i) => ({ ...p, hue: Math.round((360 / 6) * i) }));

  const body = document.body;
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(stage.clientWidth || window.innerWidth, stage.clientHeight || window.innerHeight);
  stage.appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(75, (stage.clientWidth||window.innerWidth)/(stage.clientHeight||window.innerHeight), 0.1, 4000);
  let lon = 0, lat = 0, planetMode = false, autoRotating = false;
  let appState = 'gallery';

  function makeDemoTexture(label, hue){
    const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
    const ctx = c.getContext('2d');
    const sky = ctx.createLinearGradient(0,0,0,c.height*0.55);
    sky.addColorStop(0, `hsl(${hue},60%,25%)`); sky.addColorStop(1, `hsl(${hue},55%,55%)`);
    ctx.fillStyle = sky; ctx.fillRect(0,0,c.width,c.height*0.55);
    const ground = ctx.createLinearGradient(0,c.height*0.55,0,c.height);
    ground.addColorStop(0, `hsl(${hue+30},30%,35%)`); ground.addColorStop(1, `hsl(${hue+30},30%,12%)`);
    ctx.fillStyle = ground; ctx.fillRect(0,c.height*0.55,c.width,c.height*0.45);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(label, c.width/2, c.height*0.52);
    return new THREE.CanvasTexture(c);
  }
  // Loads a real photo if present; falls back to a placeholder planet if not found.
  function ensureTexture(photo, cb){
    if(photo.texture){ cb(photo.texture); return; }
    new THREE.TextureLoader().load(photo.src, tex => { photo.texture = tex; cb(tex); },
      undefined, () => { photo.texture = makeDemoTexture(photo.caption, photo.hue); cb(photo.texture); });
  }

  // ---------- Gallery: starfield + floating photo "planets" ----------
  const galaxyScene = new THREE.Scene();
  {
    const n = 1200, positions = new Float32Array(n*3);
    for(let i=0;i<n;i++){
      const r = 800 + Math.random()*2200, th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
      positions[i*3]=r*Math.sin(ph)*Math.cos(th); positions[i*3+1]=r*Math.cos(ph); positions[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(positions,3));
    galaxyScene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:2.2, sizeAttenuation:true, transparent:true, opacity:.85 })));
  }
  const orbs = [];
  PHOTOS.forEach((photo, i) => {
    const group = new THREE.Group();
    const visible = new THREE.Mesh(new THREE.SphereGeometry(26,28,20), new THREE.MeshBasicMaterial({ color:0x888888 }));
    const hit = new THREE.Mesh(new THREE.SphereGeometry(42,12,10), new THREE.MeshBasicMaterial({ transparent:true, opacity:0, depthWrite:false }));
    group.add(visible); group.add(hit);
    galaxyScene.add(group);
    const orbit = { group, hit, photo, radius:220+Math.random()*260, speed:0.05+Math.random()*0.08,
      incl:(Math.random()-0.5)*1.4, phase:(i/PHOTOS.length)*Math.PI*2, spin:0.1+Math.random()*0.2 };
    hit.userData.orbit = orbit;
    orbs.push(orbit);
    ensureTexture(photo, tex => { visible.material.map = tex; visible.material.color.set(0xffffff); visible.material.needsUpdate = true; });
  });

  // ---------- Normal sphere viewer ----------
  const sceneNormal = new THREE.Scene();
  const sphereGeo = new THREE.SphereGeometry(500,60,40); sphereGeo.scale(-1,1,1);
  const material = new THREE.MeshBasicMaterial();
  sceneNormal.add(new THREE.Mesh(sphereGeo, material));

  // ---------- Tiny planet (stereographic) viewer ----------
  const scenePlanet = new THREE.Scene();
  const orthoCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const planetUniforms = { map:{value:null}, resolution:{value:new THREE.Vector2(1,1)}, lon:{value:0}, lat:{value:0}, fov:{value:75} };
  const planetMaterial = new THREE.ShaderMaterial({
    uniforms: planetUniforms,
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
    fragmentShader:`
      precision highp float;
      uniform sampler2D map; uniform vec2 resolution; uniform float lon, lat, fov;
      const float PI = 3.14159265359;
      vec2 equirectUv(vec3 dir){
        float u = fract(atan(dir.z, dir.x) / (2.0*PI)); // identical to the normal sphere view's UV layout (not mirrored)
        float v = asin(clamp(dir.y,-1.0,1.0)) / PI + 0.5;
        return vec2(u, v);
      }
      void main(){
        vec2 uv = (gl_FragCoord.xy/resolution.xy)*2.0-1.0;
        uv.x *= resolution.x/resolution.y;
        float scale = tan(radians(fov)*0.5) * 2.0;
        float r = length(uv) * scale;
        float theta = atan(uv.y, uv.x);
        float c = 2.0 * atan(r);
        float phi = radians(90.0 - lat);
        float lam = radians(lon);
        vec3 forward = normalize(vec3(sin(phi)*cos(lam), cos(phi), sin(phi)*sin(lam)));
        // Same handedness as the normal 360 view (was mirrored), and smooth at the poles
        vec3 right = vec3(-sin(lam), 0.0, cos(lam));
        vec3 up = cross(right, forward);
        vec3 dir = forward*cos(c) + (right*cos(theta) + up*sin(theta)) * sin(c);
        gl_FragColor = texture2D(map, equirectUv(normalize(dir)));
      }`
  });
  scenePlanet.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), planetMaterial));

  function setViewerTexture(tex){
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.ClampToEdgeWrapping; tex.needsUpdate = true;
    material.map = tex; material.needsUpdate = true;
    const planetTex = tex.clone();
    planetTex.image = tex.image; planetTex.generateMipmaps = false;
    planetTex.minFilter = THREE.LinearFilter; planetTex.magFilter = THREE.LinearFilter;
    planetTex.wrapS = THREE.RepeatWrapping; planetTex.wrapT = THREE.ClampToEdgeWrapping; planetTex.needsUpdate = true;
    planetUniforms.map.value = planetTex;
  }

  // ---------- UI ----------
  const hint = document.getElementById('hint');
  const footer = document.getElementById('footer');
  const INITIAL_LON = 180; // faces the centre of the panorama (lon 0 looked at the image seam)
  function setHint(text, autoHide){
    hint.textContent = text; hint.style.opacity = '1'; clearTimeout(hint._t);
    if(autoHide) hint._t = setTimeout(() => hint.style.opacity = '0', 3200);
  }
  function openViewer(photo){
    ensureTexture(photo, tex => {
      setViewerTexture(tex);
      appState = 'viewer'; body.classList.add('mode-viewer'); stage.classList.add('grab');
      lon = INITIAL_LON; lat = 0; planetMode = false; setFov(75);
      const mt = document.getElementById('modeToggle');
      mt.querySelector('.label').textContent = 'Tiny Planet'; mt.querySelector('.icon').textContent='🪐'; mt.classList.remove('active');
      document.getElementById('caption').textContent = photo.caption || '';
      setHint('Drag to look around · Pinch or scroll to zoom', true);
      resize();
    });
  }
  function backToSpace(){ appState='gallery'; body.classList.remove('mode-viewer'); stage.classList.remove('grab','grabbing'); setHint('Tap a floating photo to explore it in 360°', true); resize(); }
  document.getElementById('backBtn').addEventListener('click', backToSpace);
  setHint('Tap a floating photo to explore it in 360°', true);

  // ---------- Controls (Pointer Events: one code path for mouse, touch and pen) ----------
  const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
  const pointers = new Map();
  let downX=0, downY=0, startLon=0, startLat=0, moved=false, pinchDist=0, isDown=false;
  function pickOrb(x,y){
    const r = renderer.domElement.getBoundingClientRect();
    mouse.x=((x-r.left)/r.width)*2-1; mouse.y=-((y-r.top)/r.height)*2+1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(orbs.map(o=>o.hit));
    return hits.length ? hits[0].object.userData.orbit.photo : null;
  }
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===1){ isDown=true; downX=e.clientX; downY=e.clientY; startLon=lon; startLat=lat; moved=false; stage.classList.add('grabbing'); }
    else if(pointers.size===2){ const [a,b]=[...pointers.values()]; pinchDist=Math.hypot(a.x-b.x,a.y-b.y); moved=true; }
  });
  el.addEventListener('pointermove', e => {
    if(!pointers.has(e.pointerId)){
      if(appState==='gallery' && e.pointerType==='mouse') stage.classList.toggle('pointer', !!pickOrb(e.clientX,e.clientY));
      return;
    }
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size>=2){
      const [a,b]=[...pointers.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(appState==='viewer') setFov(camera.fov + (pinchDist-d)*0.15);
      pinchDist=d; return;
    }
    if(Math.hypot(e.clientX-downX,e.clientY-downY) > 6) moved = true;
    // Content follows the finger/cursor: drag right -> image moves right, drag down -> image moves down
    const k = (planetMode?0.2:0.15) * (camera.fov/75 > 1 ? 1 : Math.max(camera.fov/75, .5));
    lon = startLon + (downX-e.clientX) * k;
    lat = Math.max(-90, Math.min(90, startLat + (e.clientY-downY) * k));
  });
  function endPointer(e){
    if(!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if(pointers.size===1){ const p=[...pointers.values()][0]; downX=p.x; downY=p.y; startLon=lon; startLat=lat; }
    if(pointers.size===0){
      isDown=false; stage.classList.remove('grabbing');
      if(e.type==='pointerup' && appState==='gallery' && !moved){ const p = pickOrb(e.clientX,e.clientY); if(p) openViewer(p); }
    }
  }
  el.addEventListener('pointerup', endPointer);
  el.addEventListener('pointercancel', endPointer);

  function setFov(v){
    camera.fov = Math.max(35, Math.min(100, v)); camera.updateProjectionMatrix();
    planetUniforms.fov.value = camera.fov; document.getElementById('zoomSlider').value = Math.round(camera.fov);
  }
  el.addEventListener('wheel', e => { e.preventDefault(); if(appState==='viewer') setFov(camera.fov + e.deltaY*0.03); }, {passive:false});
  document.getElementById('zoomSlider').addEventListener('input', e => setFov(Number(e.target.value)));

  document.getElementById('autoRotate').addEventListener('click', e => {
    autoRotating = !autoRotating;
    e.currentTarget.querySelector('.icon').textContent = autoRotating ? '⏸' : '▶';
    e.currentTarget.querySelector('.label').textContent = autoRotating ? 'Stop' : 'Rotate';
    e.currentTarget.classList.toggle('active', autoRotating);
  });
  const fsBtn = document.getElementById('fullscreen'), root = document.documentElement;
  const reqFs = root.requestFullscreen || root.webkitRequestFullscreen;
  if(!reqFs) fsBtn.style.display = 'none'; // e.g. iPhone Safari has no fullscreen API
  fsBtn.addEventListener('click', () => {
    if(!(document.fullscreenElement || document.webkitFullscreenElement)) reqFs.call(root);
    else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  });
  const modeBtn = document.getElementById('modeToggle');
  modeBtn.addEventListener('click', () => {
    planetMode = !planetMode;
    modeBtn.querySelector('.icon').textContent = planetMode ? '↔' : '🪐';
    modeBtn.querySelector('.label').textContent = planetMode ? 'Normal' : 'Tiny Planet';
    modeBtn.classList.toggle('active', planetMode);
    if(planetMode && lat>-20 && lat<20){ lat=-80; setFov(100); }
    setHint(planetMode ? 'Drag to spin · Drag up/down to flip planet ↔ rabbit hole'
                        : 'Drag to look around · Pinch or scroll to zoom', true);
  });

  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    if(autoRotating && appState==='viewer') lon += 0.05;
    if(appState==='gallery' && !isDown) lon += 0.02;
    planetUniforms.lon.value = lon; planetUniforms.lat.value = lat;

    const phi = THREE.MathUtils.degToRad(90-lat), theta = THREE.MathUtils.degToRad(lon);
    const dist = appState==='gallery' ? 1 : 500;
    camera.position.set(0,0,0);
    camera.lookAt(dist*Math.sin(phi)*Math.cos(theta), dist*Math.cos(phi), dist*Math.sin(phi)*Math.sin(theta));

    if(appState==='gallery'){
      orbs.forEach(o => {
        const a = o.phase + t*o.speed;
        o.group.position.set(o.radius*Math.cos(a), o.radius*Math.sin(a)*Math.sin(o.incl), o.radius*Math.sin(a)*Math.cos(o.incl));
        o.group.children[0].rotation.y += o.spin*0.01;
      });
      renderer.render(galaxyScene, camera);
    } else if(planetMode){
      renderer.render(scenePlanet, orthoCam);
    } else {
      renderer.render(sceneNormal, camera);
    }
  }

  // ---------- Resize (mobile toolbars, rotation, HiDPI) ----------
  function resize(){
    const w = stage.clientWidth || window.innerWidth, h = stage.clientHeight || window.innerHeight;
    camera.aspect = w/h; camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = '100%'; renderer.domElement.style.height = '100%';
    // gl_FragCoord is in device pixels, so the shader needs the drawing-buffer size (this fixes the off-centre planet)
    const v = new THREE.Vector2(); renderer.getDrawingBufferSize(v); planetUniforms.resolution.value.copy(v);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();
  animate();
})();
</script>
</body>
</html>
